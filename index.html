    <script>
      // Permanently suppress Vite HMR WebSocket closed warnings in AI Studio preview
      if (typeof window !== 'undefined') {
        const originalError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('WebSocket closed without opened') || args[0].includes('[vite]'))) {
            return;
          }
          originalError.apply(console, args);
        };
      }
    </script>
